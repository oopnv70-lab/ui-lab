name: Build APK

# 只产出一个「有签名、可直接安装」的 debug APK。
# - 不再构建 release（之前会额外产出未签名的 app-release-unsigned.apk
#   以及 Gradle 自动打包的 unsigned-apk.zip，都是无法安装的无用产物）
# - 构建时间因此大约减半
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android 17 platform (API 37)
        run: |
          # Android 17 的平台包名是 platforms;android-37.0（次要版本命名）
          sdkmanager --install "platforms;android-37.0" "platform-tools" "build-tools;36.0.0"
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms"

      - name: Point Gradle to SDK only
        run: |
          # 只写 sdk.dir；不要写已废弃的 ndk.dir
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.7.1

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and verify APK
        run: |
          set -o pipefail
          mkdir -p out
          # debug 构建只会产出 app-debug.apk（已用 debug keystore 签名，可直接安装）
          cp app/build/outputs/apk/debug/app-debug.apk out/ui-lab-debug.apk
          ls -la out
          echo "--- APK 签名校验 ---"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/ui-lab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-lab-debug-apk
          path: out/ui-lab-debug.apk
          if-no-files-found: error
